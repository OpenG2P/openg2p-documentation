<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="Who calls whom at the Exchange, before and after design decision 8. Before: the Composite reads the partner's use-case policy from the Exchange Partner Management, and the Exchange Consent Manager reads the same policy again, plus the partner's keys; the Composite calls the Consent Manager's validate with the use case, and the Consent Manager calls the Composite back to read the use case. Two cycles: one policy enforced in two places, and a call back during each query. After: the Composite reads the use-case policy, the only grant check, and calls validate with the purpose, scopes and limits; the Consent Manager reads only the partner's keys from Partner Management and reads no use case. The Consent Manager's partner portal reads consent templates from the Composite only when a consent is created, never during a query."><style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:14px;font-weight:600} .s{font-size:11.5px;fill:#56625B} .lbl{font-size:11.5px;fill:#3B4640}
.bad{font-size:11.5px;fill:#A1261B;font-weight:600}
.cap{font-size:11px;letter-spacing:.08em;fill:#3B4640;font-family:'JetBrains Mono',Menlo,monospace;font-weight:700}
.col{fill:#FAFBFA;stroke:#B4BDB6;stroke-width:1.2;stroke-dasharray:5 4}
.box{fill:#FFFFFF;stroke:#3B4640;stroke-width:1.3}
.cmp{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.cm{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5}
.ar{stroke:#3B4640;stroke-width:1.4;fill:none}
.arb{stroke:#A1261B;stroke-width:1.8;fill:none}
.ard{stroke:#3B4640;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4640"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A1261B"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- ===== BEFORE ===== -->
<rect class="col" x="16" y="16" width="520" height="438" rx="10"/>
<text class="cap" x="32" y="40">BEFORE · TWO CYCLES</text>

<rect class="cmp" x="186" y="72" width="180" height="56" rx="8"/>
<text class="t" x="276" y="96" text-anchor="middle">Composite</text>
<text class="s" x="276" y="115" text-anchor="middle">use case definitions</text>

<rect class="box" x="46" y="300" width="170" height="56" rx="8"/>
<text class="t" x="131" y="324" text-anchor="middle">Exchange PM</text>
<text class="s" x="131" y="343" text-anchor="middle">keys · use-case policies</text>

<rect class="cm" x="336" y="300" width="170" height="56" rx="8"/>
<text class="t" x="421" y="324" text-anchor="middle">Exchange CM</text>
<text class="s" x="421" y="343" text-anchor="middle">consents for a use case</text>

<!-- Composite -> PM -->
<line class="ar" x1="236" y1="128" x2="148" y2="296" marker-end="url(#a)"/>
<text class="lbl" x="180" y="200" text-anchor="end">use-case policy</text>
<!-- CM -> PM: same policy again -->
<line class="arb" x1="336" y1="328" x2="220" y2="328" marker-end="url(#b)"/>
<text class="bad" x="278" y="378" text-anchor="middle">the same policy again</text>
<text class="s" x="278" y="394" text-anchor="middle">(+ partner keys)</text>
<!-- Composite -> CM validate -->
<line class="ar" x1="306" y1="128" x2="384" y2="296" marker-end="url(#a)"/>
<text class="lbl" x="332" y="232" text-anchor="end">/validate</text>
<text class="lbl" x="332" y="248" text-anchor="end">with the use case</text>
<!-- CM -> Composite: call back -->
<line class="arb" x1="440" y1="298" x2="352" y2="132" marker-end="url(#b)"/>
<text class="bad" x="414" y="200">calls back for</text>
<text class="bad" x="414" y="216">the use case</text>

<text class="s" x="32" y="424">One policy enforced in two places, each with its own cache;</text>
<text class="s" x="32" y="440">the CM depends on use cases and on the Composite.</text>

<!-- ===== AFTER ===== -->
<rect class="col" x="564" y="16" width="520" height="438" rx="10"/>
<text class="cap" x="580" y="40">AFTER · NO CYCLE DURING A QUERY</text>

<rect class="cmp" x="734" y="72" width="180" height="56" rx="8"/>
<text class="t" x="824" y="96" text-anchor="middle">Composite</text>
<text class="s" x="824" y="115" text-anchor="middle">use cases · the grant check</text>

<rect class="box" x="594" y="300" width="170" height="56" rx="8"/>
<text class="t" x="679" y="324" text-anchor="middle">Exchange PM</text>
<text class="s" x="679" y="343" text-anchor="middle">keys · use-case policies</text>

<rect class="cm" x="884" y="300" width="170" height="56" rx="8"/>
<text class="t" x="969" y="324" text-anchor="middle">Exchange CM</text>
<text class="s" x="969" y="343" text-anchor="middle">consents: purpose + scopes</text>

<!-- Composite -> PM -->
<line class="ar" x1="784" y1="128" x2="696" y2="296" marker-end="url(#a)"/>
<text class="lbl" x="728" y="196" text-anchor="end">use-case policy:</text>
<text class="lbl" x="728" y="212" text-anchor="end">the only grant check</text>
<!-- CM -> PM keys only -->
<line class="ar" x1="884" y1="328" x2="768" y2="328" marker-end="url(#a)"/>
<text class="lbl" x="826" y="378" text-anchor="middle">partner keys only</text>
<!-- Composite -> CM validate -->
<line class="ar" x1="854" y1="128" x2="932" y2="296" marker-end="url(#a)"/>
<text class="lbl" x="880" y="232" text-anchor="end">/validate: purpose,</text>
<text class="lbl" x="880" y="248" text-anchor="end">scopes, limits</text>
<!-- CM -> Composite templates, dashed -->
<line class="ard" x1="988" y1="298" x2="900" y2="132" marker-end="url(#a)"/>
<text class="lbl" x="954" y="196">consent templates</text>
<text class="s" x="954" y="212">partner portal, when a</text>
<text class="s" x="954" y="228">consent is created</text>

<text class="s" x="580" y="424">The CM gets the terms with each request and reads no use case;</text>
<text class="s" x="580" y="440">templates come from a source set at install (here, the Composite).</text>
</svg>
