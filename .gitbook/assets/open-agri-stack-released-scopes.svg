<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="250" viewBox="0 0 1060 250" role="img" aria-label="Effective scopes are the intersection of what the use case asks for, what the PM policy allows, and what the farmer consented to. In the example only farmer profile and crop season are released."><style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:13px;font-weight:600} .s{font-size:11px;fill:#56625B} .lbl{font-size:11.5px;fill:#56625B}
.cap{font-size:10px;letter-spacing:.08em;fill:#56625B;font-family:'JetBrains Mono',Menlo,monospace}
.l1{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5} .l2{fill:#F7ECD4;stroke:#AE8433;stroke-width:1.5}
.dpi{fill:#E1EEF0;stroke:#3C7C88;stroke-width:1.5} .uc{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.plain{fill:#FFFFFF;stroke:#3B4640;stroke-width:1.3}
.dept{fill:none;stroke:#C8D0C8;stroke-width:1.3;stroke-dasharray:5 4}
.band{fill:none;stroke:#56625B;stroke-width:1.2;stroke-dasharray:6 5}
.ar{stroke:#3B4640;stroke-width:1.4;fill:none} .ar.d{stroke-dasharray:5 4}
.life{stroke:#C8D0C8;stroke-width:1.2;stroke-dasharray:4 4}
.chip-ok{fill:#DDEFE3;stroke:none} .chip-no{fill:none;stroke:#C8D0C8;stroke-dasharray:4 3}
.ok{font-size:12px;fill:#1F5B3A;font-family:'JetBrains Mono',Menlo,monospace}
.no{font-size:12px;fill:#8A948E;font-family:'JetBrains Mono',Menlo,monospace}
.strike{stroke:#8A948E;stroke-width:1.2} .op{font-size:22px;fill:#56625B;font-weight:500}
.x{stroke:#C0463B;stroke-width:2}
</style><rect width="100%" height="100%" fill="#FFFFFF"/>
      <!-- column boxes -->
      <rect class="uc" x="20" y="14" width="220" height="222" rx="8"/>
      <rect class="dpi" x="290" y="14" width="220" height="222" rx="8"/>
      <rect class="dpi" x="560" y="14" width="220" height="222" rx="8"/>
      <rect class="l1" x="830" y="14" width="210" height="222" rx="8"/>
      <text class="t" x="34" y="40">Use case asks for</text><text class="s" x="34" y="57">composite configuration</text>
      <text class="t" x="304" y="40">Policy allows</text><text class="s" x="304" y="57">PM · approved per department</text>
      <text class="t" x="574" y="40">Farmer consented to</text><text class="s" x="574" y="57">CM · one object per registry</text>
      <text class="t" x="844" y="40">Released</text><text class="s" x="844" y="57">each registry, its own slice</text>
      <text class="op" x="265" y="132" text-anchor="middle">∩</text>
      <text class="op" x="535" y="132" text-anchor="middle">∩</text>
      <text class="op" x="805" y="132" text-anchor="middle">=</text>

      <!-- use case chips -->
      <rect class="chip-ok" x="34" y="74" width="192" height="26" rx="5"/><text class="ok" x="46" y="92">farmer:profile</text>
      <rect class="chip-ok" x="34" y="110" width="192" height="26" rx="5"/><text class="ok" x="46" y="128">farmer:land</text>
      <rect class="chip-ok" x="34" y="146" width="192" height="26" rx="5"/><text class="ok" x="46" y="164">crop:season</text>
      <rect class="chip-ok" x="34" y="182" width="192" height="26" rx="5"/><text class="ok" x="46" y="200">livestock:herd</text>

      <!-- policy chips -->
      <rect class="chip-ok" x="304" y="74" width="192" height="26" rx="5"/><text class="ok" x="316" y="92">farmer:profile</text>
      <rect class="chip-ok" x="304" y="110" width="192" height="26" rx="5"/><text class="ok" x="316" y="128">farmer:land</text>
      <rect class="chip-ok" x="304" y="146" width="192" height="26" rx="5"/><text class="ok" x="316" y="164">crop:season</text>
      <rect class="chip-no" x="304" y="182" width="192" height="26" rx="5"/><text class="no" x="316" y="200">livestock:herd</text>
      <line class="strike" x1="314" y1="196" x2="420" y2="196"/>
      <text class="s" x="304" y="226">livestock section not yet approved</text>

      <!-- consent chips -->
      <rect class="chip-ok" x="574" y="74" width="192" height="26" rx="5"/><text class="ok" x="586" y="92">farmer:profile</text>
      <rect class="chip-no" x="574" y="110" width="192" height="26" rx="5"/><text class="no" x="586" y="128">farmer:land</text>
      <line class="strike" x1="584" y1="124" x2="674" y2="124"/>
      <rect class="chip-ok" x="574" y="146" width="192" height="26" rx="5"/><text class="ok" x="586" y="164">crop:season</text>
      <rect class="chip-ok" x="574" y="182" width="192" height="26" rx="5"/><text class="ok" x="586" y="200">livestock:herd</text>
      <text class="s" x="574" y="226">farmer declined to share land</text>

      <!-- result -->
      <rect class="chip-ok" x="844" y="74" width="182" height="26" rx="5"/><text class="ok" x="856" y="92">farmer:profile</text>
      <rect class="chip-ok" x="844" y="146" width="182" height="26" rx="5"/><text class="ok" x="856" y="164">crop:season</text>
    </svg>
