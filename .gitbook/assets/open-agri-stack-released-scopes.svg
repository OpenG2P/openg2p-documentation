<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1206" height="330" viewBox="0 0 1206 330" role="img" aria-label="What a registry releases through the Composite: what the use case asks for, limited to a use case the partner is granted in the Exchange's Partner Management, intersected with the farmer's consent at the Exchange Consent Manager, which puts the result into each registry's consent token, then intersected with the department's ceiling for the Composite (its scope policy in the department's Partner Management) at that registry's Consent Manager. In the example the bank is granted the use case, the farmer declines land, and the Livestock Department does not allow herd data, so farmer personal details, crop season and crop measures are released."><style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:13px;font-weight:600} .s{font-size:11px;fill:#56625B} .lbl{font-size:11.5px;fill:#56625B}
.cap{font-size:10px;letter-spacing:.07em;fill:#56625B;font-family:'JetBrains Mono',Menlo,monospace}
.l1{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5}
.dpi{fill:#E1EEF0;stroke:#3C7C88;stroke-width:1.5} .uc{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.band{fill:#F7F8F7;stroke:#B4BDB6;stroke-width:1.2;stroke-dasharray:5 4}
.chip-ok{fill:#DDEFE3;stroke:none} .chip-no{fill:none;stroke:#C8D0C8;stroke-dasharray:4 3}
.ok{font-size:11.5px;fill:#1F5B3A;font-family:'JetBrains Mono',Menlo,monospace}
.no{font-size:11.5px;fill:#8A948E;font-family:'JetBrains Mono',Menlo,monospace}
.strike{stroke:#8A948E;stroke-width:1.2} .op{font-size:22px;fill:#56625B;font-weight:500}
</style><rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- who computes what -->
  <rect class="band" x="16" y="10" width="694" height="26" rx="6"/>
  <text class="cap" x="363" y="27" text-anchor="middle">THE EXCHANGE'S CONSENT MANAGER · PUTS THE RESULT IN EACH REGISTRY'S CONSENT TOKEN</text>
  <rect class="band" x="756" y="10" width="200" height="26" rx="6"/>
  <text class="cap" x="856" y="27" text-anchor="middle">EACH REGISTRY'S OWN CM</text>
  <rect class="band" x="976" y="10" width="214" height="26" rx="6"/>
  <text class="cap" x="1083" y="27" text-anchor="middle">EACH REGISTRY</text>

  <!-- column boxes -->
  <rect class="uc" x="16" y="46" width="200" height="262" rx="8"/>
  <rect class="dpi" x="263" y="46" width="200" height="262" rx="8"/>
  <rect class="dpi" x="510" y="46" width="200" height="262" rx="8"/>
  <rect class="dpi" x="756" y="46" width="200" height="262" rx="8"/>
  <rect class="l1" x="976" y="46" width="214" height="262" rx="8"/>
  <text class="t" x="30" y="70">Use case asks for</text><text class="s" x="30" y="86">Composite: scopes, optional scopes</text>
  <text class="t" x="277" y="70">Partner is granted</text><text class="s" x="277" y="86">the use case · its policy in PM</text>
  <text class="t" x="524" y="70">Farmer consented to</text><text class="s" x="524" y="86">one consent, a grant per registry</text>
  <text class="t" x="770" y="70">Department allows</text><text class="s" x="770" y="86">Composite's ceiling, in its PM</text>
  <text class="t" x="990" y="70">Released</text><text class="s" x="990" y="86">each registry, its own slice</text>
  <text class="op" x="240" y="180" text-anchor="middle">∩</text>
  <text class="op" x="487" y="180" text-anchor="middle">∩</text>
  <text class="op" x="746" y="180" text-anchor="middle">∩</text>
  <text class="op" x="966" y="180" text-anchor="middle">=</text>

  <!-- 1 use case -->
  <rect class="chip-ok" x="30" y="100" width="172" height="26" rx="5"/><text class="ok" x="40" y="118">FR · personal details</text>
  <rect class="chip-ok" x="30" y="134" width="172" height="26" rx="5"/><text class="ok" x="40" y="152">FR · land</text>
  <rect class="chip-ok" x="30" y="168" width="172" height="26" rx="5"/><text class="ok" x="40" y="186">CSR · crop season</text>
  <rect class="chip-ok" x="30" y="202" width="172" height="26" rx="5"/><text class="ok" x="40" y="220">CSR · measures</text>
  <rect class="chip-ok" x="30" y="236" width="172" height="26" rx="5"/><text class="ok" x="40" y="254">LS · herd</text>

  <!-- 2 partner policy -->
  <rect class="chip-ok" x="277" y="100" width="172" height="26" rx="5"/><text class="ok" x="287" y="118">FR · personal details</text>
  <rect class="chip-ok" x="277" y="134" width="172" height="26" rx="5"/><text class="ok" x="287" y="152">FR · land</text>
  <rect class="chip-ok" x="277" y="168" width="172" height="26" rx="5"/><text class="ok" x="287" y="186">CSR · crop season</text>
  <rect class="chip-ok" x="277" y="202" width="172" height="26" rx="5"/><text class="ok" x="287" y="220">CSR · measures</text>
  <rect class="chip-ok" x="277" y="236" width="172" height="26" rx="5"/><text class="ok" x="287" y="254">LS · herd</text>
  <text class="s" x="277" y="290">loan-profile@1 granted: all pass</text>

  <!-- 3 consent -->
  <rect class="chip-ok" x="524" y="100" width="172" height="26" rx="5"/><text class="ok" x="534" y="118">FR · personal details</text>
  <rect class="chip-no" x="524" y="134" width="172" height="26" rx="5"/><text class="no" x="534" y="152">FR · land</text>
  <line class="strike" x1="532" y1="148" x2="598" y2="148"/>
  <rect class="chip-ok" x="524" y="168" width="172" height="26" rx="5"/><text class="ok" x="534" y="186">CSR · crop season</text>
  <rect class="chip-ok" x="524" y="202" width="172" height="26" rx="5"/><text class="ok" x="534" y="220">CSR · measures</text>
  <rect class="chip-ok" x="524" y="236" width="172" height="26" rx="5"/><text class="ok" x="534" y="254">LS · herd</text>
  <text class="s" x="524" y="290">the farmer declined: land</text>

  <!-- 4 department -->
  <rect class="chip-ok" x="770" y="100" width="172" height="26" rx="5"/><text class="ok" x="780" y="118">FR · personal details</text>
  <rect class="chip-ok" x="770" y="134" width="172" height="26" rx="5"/><text class="ok" x="780" y="152">FR · land</text>
  <rect class="chip-ok" x="770" y="168" width="172" height="26" rx="5"/><text class="ok" x="780" y="186">CSR · crop season</text>
  <rect class="chip-ok" x="770" y="202" width="172" height="26" rx="5"/><text class="ok" x="780" y="220">CSR · measures</text>
  <rect class="chip-no" x="770" y="236" width="172" height="26" rx="5"/><text class="no" x="780" y="254">LS · herd</text>
  <line class="strike" x1="778" y1="250" x2="844" y2="250"/>
  <text class="s" x="770" y="290">Livestock Dept. does not allow: herd</text>

  <!-- 5 released -->
  <rect class="chip-ok" x="990" y="100" width="186" height="26" rx="5"/><text class="ok" x="1000" y="118">FR · personal details</text>
  <rect class="chip-ok" x="990" y="168" width="186" height="26" rx="5"/><text class="ok" x="1000" y="186">CSR · crop season</text>
  <rect class="chip-ok" x="990" y="202" width="186" height="26" rx="5"/><text class="ok" x="1000" y="220">CSR · measures</text>
  <text class="s" x="990" y="290">FR: Farmer Registry · CSR: Crop Sown</text>
  <text class="s" x="990" y="303">LS: a Livestock registry</text>
</svg>
