<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Reference topology: one Kubernetes cluster with three namespaces, each installed as a separate organisation with its own commons. trial: the Farmer Registry; dept1: the Crop Sown Registry; agrix: the Exchange, with the Composite. Partners call the Composite; the Composite calls each registry by its public hostname, through the ingress.">
<style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:14px;font-weight:600} .s{font-size:11.5px;fill:#56625B} .lbl{font-size:11.5px;fill:#3B4640}
.cap{font-size:11px;letter-spacing:.08em;fill:#3B4640;font-family:'JetBrains Mono',Menlo,monospace;font-weight:700}
.mono{font-family:'JetBrains Mono',Menlo,monospace;font-size:11.5px;fill:#3B4640}
.plain{fill:#FFFFFF;stroke:#3B4640;stroke-width:1.3}
.clu{fill:#FBFCFB;stroke:#7E8A82;stroke-width:1.6}
.ns{fill:#FFFFFF;stroke:#B4BDB6;stroke-width:1.2;stroke-dasharray:5 4}
.ing{fill:#F1F2F1;stroke:#9AA39C;stroke-width:1.2;stroke-dasharray:4 3}
.dpi{fill:#E1EEF0;stroke:#3C7C88;stroke-width:1.5}
.cmp{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.reg{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5}
.ar{stroke:#3B4640;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4640"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect class="clu" x="20" y="82" width="960" height="370" rx="12"/>
<text class="cap" x="36" y="104">KUBERNETES CLUSTER</text>
<rect class="ing" x="36" y="120" width="928" height="34" rx="6"/>
<text class="lbl" x="500" y="142" text-anchor="middle">Ingress (Nginx, Istio): a public hostname per service, e.g. *.trial.openg2p.org, *.dept1.openg2p.org, *.agrix.openg2p.org</text>

<!-- namespaces -->
<rect class="ns" x="36" y="186" width="296" height="250" rx="10"/>
<text class="cap" x="52" y="208">NAMESPACE trial</text>
<text class="s" x="52" y="226">Agriculture Department</text>
<rect class="reg" x="52" y="240" width="264" height="64" rx="8"/>
<text class="t" x="184" y="266" text-anchor="middle">Farmer Registry</text><text class="s" x="184" y="285" text-anchor="middle">release fr</text>
<rect class="dpi" x="52" y="320" width="264" height="96" rx="8"/>
<text class="t" x="184" y="344" text-anchor="middle">Commons</text>
<text class="s" x="184" y="364" text-anchor="middle">Keycloak, Postgres, Partner Management,</text>
<text class="s" x="184" y="380" text-anchor="middle">Consent Manager, Master Data,</text>
<text class="s" x="184" y="396" text-anchor="middle">Audit Manager, …</text>

<rect class="ns" x="352" y="186" width="296" height="250" rx="10"/>
<text class="cap" x="368" y="208">NAMESPACE dept1</text>
<text class="s" x="368" y="226">Crops Department</text>
<rect class="reg" x="368" y="240" width="264" height="64" rx="8"/>
<text class="t" x="500" y="266" text-anchor="middle">Crop Sown Registry</text><text class="s" x="500" y="285" text-anchor="middle">release csr</text>
<rect class="dpi" x="368" y="320" width="264" height="96" rx="8"/>
<text class="t" x="500" y="344" text-anchor="middle">Commons</text>
<text class="s" x="500" y="364" text-anchor="middle">Keycloak, Postgres, Partner Management,</text>
<text class="s" x="500" y="380" text-anchor="middle">Consent Manager, Master Data,</text>
<text class="s" x="500" y="396" text-anchor="middle">Audit Manager, …</text>

<rect class="ns" x="668" y="186" width="296" height="250" rx="10"/>
<text class="cap" x="684" y="208">NAMESPACE agrix</text>
<text class="s" x="684" y="226">The Exchange · no registry</text>
<rect class="cmp" x="684" y="240" width="264" height="64" rx="8"/>
<text class="t" x="816" y="266" text-anchor="middle">Composite</text><text class="s" x="816" y="285" text-anchor="middle">release agri-composite</text>
<rect class="dpi" x="684" y="320" width="264" height="96" rx="8"/>
<text class="t" x="816" y="344" text-anchor="middle">Commons</text>
<text class="s" x="816" y="364" text-anchor="middle">Partner Management, Consent Manager</text>
<text class="s" x="816" y="380" text-anchor="middle">with partner portal, eSignet,</text>
<text class="s" x="816" y="396" text-anchor="middle">Master Data, Audit Manager, …</text>

<!-- composite -> registries via ingress -->
<line class="ar" x1="930" y1="238" x2="930" y2="156" marker-end="url(#a)"/>
<line class="ar" x1="184" y1="156" x2="184" y2="238" marker-end="url(#a)"/>
<line class="ar" x1="500" y1="156" x2="500" y2="238" marker-end="url(#a)"/>
<text class="lbl" x="194" y="178">search, by public hostname</text>
<text class="lbl" x="510" y="178">search, by public hostname</text>
<!-- partner -->
<rect class="plain" x="720" y="14" width="250" height="50" rx="8"/>
<text class="t" x="845" y="37" text-anchor="middle">Partner</text><text class="s" x="845" y="54" text-anchor="middle">bank · insurer · agritech</text>
<line class="ar" x1="845" y1="66" x2="845" y2="118" marker-end="url(#a)"/>
<text class="lbl" x="835" y="104" text-anchor="end">partners call the Composite</text>

</svg>
