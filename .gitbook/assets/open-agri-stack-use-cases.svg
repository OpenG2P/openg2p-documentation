<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="Use cases. In Partner Management, each partner is assigned the use cases it may use at onboarding: in the example, Bank A has loan-profile@1 and crop-insurance@1; Insurer B has crop-insurance@1. Each use case, defined in the Composite, has a purpose and names the data it reads from each registry: loan-profile@1, for credit assessment, reads personal details and land from the Farmer Registry and crop seasons from the Crop Sown Registry; crop-insurance@1, for insurance, reads land location from the Farmer Registry and crop seasons and measures from the Crop Sown Registry. Data is shared only through a use case assigned to the partner, with the farmer's consent for it."><style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:14px;font-weight:600} .s{font-size:11.5px;fill:#56625B} .lbl{font-size:11.5px;fill:#3B4640}
.cap{font-size:11px;letter-spacing:.08em;fill:#3B4640;font-family:'JetBrains Mono',Menlo,monospace;font-weight:700}
.col{fill:#FAFBFA;stroke:#B4BDB6;stroke-width:1.2;stroke-dasharray:5 4}
.prt{fill:#FFFFFF;stroke:#3B4640;stroke-width:1.3}
.uc{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.reg{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5}
.chip{fill:#FFFFFF;stroke:#4B8646;stroke-width:1}
.chipt{font-size:11px;fill:#2E6B3A;font-family:'JetBrains Mono',Menlo,monospace}
.sc{fill:#FFFFFF;stroke:#56799F;stroke-width:1}
.sct{font-size:11px;fill:#2F4F7F}
.ar{stroke:#3B4640;stroke-width:1.4;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4640"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>

<!-- columns -->
<rect class="col" x="16" y="16" width="290" height="380" rx="10"/>
<text class="cap" x="32" y="38">PARTNERS · IN PARTNER MANAGEMENT</text>
<rect class="col" x="360" y="16" width="380" height="380" rx="10"/>
<text class="cap" x="376" y="38">USE CASES · IN THE COMPOSITE</text>
<rect class="col" x="794" y="16" width="290" height="380" rx="10"/>
<text class="cap" x="810" y="38">REGISTRIES · DATA SCOPES</text>

<!-- partners -->
<rect class="prt" x="32" y="56" width="258" height="130" rx="8"/>
<text class="t" x="48" y="82">Bank A</text><text class="s" x="48" y="100">assigned at onboarding:</text>
<rect class="chip" x="48" y="112" width="140" height="24" rx="12"/><text class="chipt" x="118" y="128" text-anchor="middle">loan-profile@1</text>
<rect class="chip" x="48" y="146" width="160" height="24" rx="12"/><text class="chipt" x="128" y="162" text-anchor="middle">crop-insurance@1</text>
<rect class="prt" x="32" y="214" width="258" height="96" rx="8"/>
<text class="t" x="48" y="240">Insurer B</text><text class="s" x="48" y="258">assigned at onboarding:</text>
<rect class="chip" x="48" y="270" width="160" height="24" rx="12"/><text class="chipt" x="128" y="286" text-anchor="middle">crop-insurance@1</text>
<text class="s" x="32" y="340">A partner may be assigned</text><text class="s" x="32" y="356">several use cases; each is</text><text class="s" x="32" y="372">its own policy, approved in PM.</text>

<!-- use cases -->
<rect class="uc" x="376" y="56" width="348" height="130" rx="8"/>
<text class="t" x="392" y="82">loan-profile@1</text><text class="s" x="392" y="100">purpose: credit assessment</text>
<text class="s" x="392" y="122">Farmer Registry: personal details, land</text>
<text class="s" x="392" y="140">Crop Sown Registry: crop seasons</text>
<text class="s" x="392" y="166">answer: one farmer's loan profile</text>
<rect class="uc" x="376" y="214" width="348" height="130" rx="8"/>
<text class="t" x="392" y="240">crop-insurance@1 (example)</text><text class="s" x="392" y="258">purpose: insurance</text>
<text class="s" x="392" y="280">Farmer Registry: land location</text>
<text class="s" x="392" y="298">Crop Sown Registry: crop seasons, measures</text>
<text class="s" x="392" y="324">answer: one farmer's insurance profile</text>
<text class="s" x="376" y="372">A use case names its purpose, the farmer's ID it takes,</text><text class="s" x="376" y="388" style="font-size:11.5px">the data it reads from each registry and its answer.</text>

<!-- registries -->
<rect class="reg" x="810" y="56" width="258" height="130" rx="8"/>
<text class="t" x="826" y="82">Farmer Registry</text>
<rect class="sc" x="826" y="96" width="120" height="22" rx="11"/><text class="sct" x="886" y="111" text-anchor="middle">personal details</text>
<rect class="sc" x="954" y="96" width="60" height="22" rx="11"/><text class="sct" x="984" y="111" text-anchor="middle">land</text>
<rect class="sc" x="826" y="126" width="110" height="22" rx="11"/><text class="sct" x="881" y="141" text-anchor="middle">land location</text>
<rect class="sc" x="944" y="126" width="90" height="22" rx="11"/><text class="sct" x="989" y="141" text-anchor="middle">household</text>
<text class="s" x="826" y="172">… and more scopes</text>
<rect class="reg" x="810" y="214" width="258" height="130" rx="8"/>
<text class="t" x="826" y="240">Crop Sown Registry</text>
<rect class="sc" x="826" y="254" width="100" height="22" rx="11"/><text class="sct" x="876" y="269" text-anchor="middle">crop seasons</text>
<rect class="sc" x="934" y="254" width="80" height="22" rx="11"/><text class="sct" x="974" y="269" text-anchor="middle">measures</text>
<rect class="sc" x="826" y="284" width="80" height="22" rx="11"/><text class="sct" x="866" y="299" text-anchor="middle">location</text>
<text class="s" x="826" y="330">… and more scopes</text>

<!-- arrows -->
<line class="ar" x1="190" y1="124" x2="374" y2="112" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="158" x2="374" y2="250" marker-end="url(#a)"/>
<line class="ar" x1="210" y1="282" x2="374" y2="270" marker-end="url(#a)"/>
<line class="ar" x1="726" y1="120" x2="808" y2="120" marker-end="url(#a)"/>
<line class="ar" x1="726" y1="140" x2="808" y2="270" marker-end="url(#a)"/>
<line class="ar" x1="726" y1="280" x2="808" y2="138" marker-end="url(#a)"/>
<line class="ar" x1="726" y1="298" x2="808" y2="290" marker-end="url(#a)"/>

<text class="lbl" x="550" y="434" text-anchor="middle">Data flows only through a use case assigned to the partner, with the farmer's consent for that use case;</text>
<text class="lbl" x="550" y="452" text-anchor="middle">each registry still releases only what its department allows.</text>
</svg>
