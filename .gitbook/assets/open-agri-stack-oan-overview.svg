<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="OAN above Agri Stack. OAN holds use-case services, for example access to credit, access to market, grievance, access to payment. Agri Stack below has three layers: the Exchange for consented data sharing (national-ID login, Composite, consent, Partner Management), the registries as systems of record (Farmer Registry, Crop Sown Registry, Livestock Registry, Land Registry), each issuing verifiable credentials, and the catalogues as common vocabulary (crop, seed, inputs, livestock, location, land). OAN services send signed requests to the Exchange; the Exchange searches each registry with its consent token."><style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.h1{font-size:28px;font-weight:700} .sub{font-size:14px;fill:#56625B}
.lt{font-size:13px;font-weight:700;fill:#FFFFFF;letter-spacing:.03em} .ls{font-size:11px;fill:#C9D2CC;letter-spacing:.05em}
.t{font-size:16px;font-weight:600} .s{font-size:12px;fill:#56625B}
.cap{font-size:12px;letter-spacing:.1em;fill:#1F2A33;font-family:'JetBrains Mono',Menlo,monospace;font-weight:700}
.big{font-size:20px;letter-spacing:.08em;font-weight:800;font-family:'Public Sans','Helvetica Neue',Arial,sans-serif}
.lbl{font-size:11.5px;fill:#3B4640}
.side{fill:#1F2A33}
.oanbox{fill:#F5F3FB;stroke:#6B5CA5;stroke-width:1.8}
.oan{fill:#EAE5F7;stroke:#6B5CA5;stroke-width:1.2}
.stack{fill:#EEF6EA;stroke:#3E7A3A;stroke-width:2.2}
.dpi{fill:#E1EEF0;stroke:#3C7C88;stroke-width:1.2}
.reg{fill:#E8EEF7;stroke:#4A6FA5;stroke-width:1.3}
.regp{fill:#F3F5F9;stroke:#8EA3C4;stroke-width:1.3;stroke-dasharray:5 4}
.ref{fill:#F3E9CC;stroke:#A88A3D;stroke-width:1.2}
.vc{fill:#FFFFFF;stroke:#4A6FA5;stroke-width:1}
.vct{font-size:10.5px;font-weight:600;fill:#2F4F7F}
.tag{font-size:10.5px;fill:#6B7A90;font-style:italic}
.ar{stroke:#2E6B3A;stroke-width:2;fill:none}
.more{fill:#FAFAFC;stroke:#9A93BE;stroke-width:1.2;stroke-dasharray:5 4}
.ts{font-size:15px;font-weight:600}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B3A"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="h1" x="30" y="44">OAN and Agri Stack</text>
<rect class="oanbox" x="30" y="88" width="1140" height="140" rx="12"/>
<text class="big" x="46" y="116" style="fill:#4A3D86">OAN</text>
<rect class="side" x="46" y="130" width="200" height="82" rx="10"/>
<text class="lt" x="146" y="166" text-anchor="middle">EXAMPLE USE CASES</text>
<text class="ls" x="146" y="185" text-anchor="middle">VALUE TO THE FARMER</text>
<rect class="oan" x="262" y="130" width="168" height="82" rx="9"/><text class="ts" x="346" y="166" text-anchor="middle">Access to Credit</text><text class="s" x="346" y="186" text-anchor="middle">farmer data → credit</text>
<rect class="oan" x="442" y="130" width="168" height="82" rx="9"/><text class="ts" x="526" y="166" text-anchor="middle">Access to Market</text><text class="s" x="526" y="186" text-anchor="middle">marketplace + registry</text>
<rect class="oan" x="622" y="130" width="168" height="82" rx="9"/><text class="ts" x="706" y="166" text-anchor="middle">Grievance</text><text class="s" x="706" y="186" text-anchor="middle">registration + routing</text>
<rect class="oan" x="802" y="130" width="168" height="82" rx="9"/><text class="ts" x="886" y="166" text-anchor="middle">Access to Payment</text><text class="s" x="886" y="186" text-anchor="middle">transaction services</text>
<rect class="more" x="982" y="130" width="172" height="82" rx="9"/><text class="ts" x="1068" y="176" text-anchor="middle" style="fill:#6B6590">…and more</text>
<line class="ar" x1="708" y1="230" x2="708" y2="288" marker-end="url(#a)"/>
<text class="lbl" x="718" y="256">a use case, for a farmer</text>
<text class="lbl" x="718" y="271">(Beckn or Agri Stack's own API)</text>

<!-- Agri Stack -->
<rect class="stack" x="30" y="292" width="1140" height="398" rx="14"/>
<text class="big" x="46" y="320" style="fill:#2E6B3A">AGRI STACK</text>

<rect class="side" x="46" y="332" width="200" height="88" rx="10"/>
<text class="lt" x="146" y="370" text-anchor="middle">EXCHANGE</text>
<text class="ls" x="146" y="389" text-anchor="middle">CONSENTED DATA SHARING</text>
<rect class="dpi" x="262" y="332" width="214" height="88" rx="9"/><text class="t" x="369" y="369" text-anchor="middle">National-ID Login</text><text class="s" x="369" y="389" text-anchor="middle">the farmer proves who they are</text>
<rect class="dpi" x="488" y="332" width="214" height="88" rx="9" style="stroke:#2A6470;stroke-width:2.2"/><text class="t" x="595" y="369" text-anchor="middle">Composite</text><text class="s" x="595" y="389" text-anchor="middle">one query, many registries</text>
<rect class="dpi" x="714" y="332" width="214" height="88" rx="9"/><text class="t" x="821" y="369" text-anchor="middle">Consent</text><text class="s" x="821" y="389" text-anchor="middle">purpose · consent tokens</text>
<rect class="dpi" x="940" y="332" width="214" height="88" rx="9"/><text class="t" x="1047" y="369" text-anchor="middle">Partner Management</text><text class="s" x="1047" y="389" text-anchor="middle">partners · keys · policies</text>

<line class="ar" x1="708" y1="422" x2="708" y2="458" marker-end="url(#a)"/>
<text class="lbl" x="718" y="444">search + its consent token, per registry</text>

<rect class="side" x="46" y="462" width="200" height="108" rx="10"/>
<text class="lt" x="146" y="510" text-anchor="middle">REGISTRIES</text>
<text class="ls" x="146" y="529" text-anchor="middle">SYSTEMS OF RECORD</text>
<rect class="reg" x="262" y="462" width="214" height="108" rx="9"/>
<text class="t" x="369" y="496" text-anchor="middle">Farmer Registry</text><text class="s" x="369" y="516" text-anchor="middle">farmer identity · profile</text>
<rect class="vc" x="321" y="536" width="96" height="22" rx="11"/><text class="vct" x="369" y="551" text-anchor="middle">issues VCs</text>
<rect class="reg" x="488" y="462" width="214" height="108" rx="9"/>
<text class="t" x="595" y="496" text-anchor="middle">Crop Sown Registry</text><text class="s" x="595" y="516" text-anchor="middle">crop, plot, seasonal activity</text>
<rect class="vc" x="547" y="536" width="96" height="22" rx="11"/><text class="vct" x="595" y="551" text-anchor="middle">issues VCs</text>
<rect class="reg" x="714" y="462" width="214" height="108" rx="9"/>
<text class="t" x="821" y="496" text-anchor="middle">Livestock Registry</text><text class="s" x="821" y="516" text-anchor="middle">herd · animal lifecycle</text>
<rect class="vc" x="773" y="536" width="96" height="22" rx="11"/><text class="vct" x="821" y="551" text-anchor="middle">issues VCs</text>
<rect class="reg" x="940" y="462" width="214" height="108" rx="9"/>
<text class="t" x="1047" y="496" text-anchor="middle">Land Registry</text><text class="s" x="1047" y="516" text-anchor="middle">parcels · holding · tenure</text>
<rect class="vc" x="999" y="536" width="96" height="22" rx="11"/><text class="vct" x="1047" y="551" text-anchor="middle">issues VCs</text>

<rect class="side" x="46" y="586" width="200" height="88" rx="10"/>
<text class="lt" x="146" y="624" text-anchor="middle">CATALOGUES</text>
<text class="ls" x="146" y="643" text-anchor="middle">COMMON VOCABULARY</text>
<rect class="ref" x="262" y="586" width="138" height="88" rx="8"/><text class="t" x="331" y="624" text-anchor="middle">Crop</text><text class="s" x="331" y="643" text-anchor="middle">classification</text>
<rect class="ref" x="412" y="586" width="138" height="88" rx="8"/><text class="t" x="481" y="624" text-anchor="middle">Seed</text><text class="s" x="481" y="643" text-anchor="middle">varieties</text>
<rect class="ref" x="562" y="586" width="138" height="88" rx="8"/><text class="t" x="631" y="624" text-anchor="middle">Inputs</text><text class="s" x="631" y="643" text-anchor="middle">reference</text>
<rect class="ref" x="712" y="586" width="138" height="88" rx="8"/><text class="t" x="781" y="624" text-anchor="middle">Livestock</text><text class="s" x="781" y="643" text-anchor="middle">species · breeds</text>
<rect class="ref" x="862" y="586" width="138" height="88" rx="8"/><text class="t" x="931" y="624" text-anchor="middle">Location</text><text class="s" x="931" y="643" text-anchor="middle">geography</text>
<rect class="ref" x="1012" y="586" width="142" height="88" rx="8"/><text class="t" x="1083" y="624" text-anchor="middle">Land</text><text class="s" x="1083" y="643" text-anchor="middle">land reference</text>

<text class="s" x="30" y="722">Each department runs its own registry. Catalogues are public.</text>
</svg>
