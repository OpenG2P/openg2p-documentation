<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" aria-label="One partner request across the tiers and where trust is checked">
<style>
text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.h{font-size:14px;font-weight:500}.s{font-size:12px}
.pf{fill:#EEEDFE;stroke:#534AB7}.ph{fill:#3C3489}.ps{fill:#534AB7}
.tf{fill:#E1F5EE;stroke:#0F6E56}.th{fill:#085041}.ts{fill:#0F6E56}
.gf{fill:#F1EFE8;stroke:#5F5E5A}.gh{fill:#444441}.gs{fill:#5F5E5A}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="356" fill="#ffffff"/>
<rect x="255" y="40" width="170" height="56" rx="8" class="pf" stroke-width="0.8"/><text class="h ph" x="340" y="58" text-anchor="middle" dominant-baseline="central">Exchange CM</text><text class="s ps" x="340" y="78" text-anchor="middle" dominant-baseline="central">Issues signed receipt</text>
<rect x="40" y="150" width="170" height="56" rx="8" class="gf" stroke-width="0.8"/><text class="h gh" x="125" y="168" text-anchor="middle" dominant-baseline="central">Partner app</text><text class="s gs" x="125" y="188" text-anchor="middle" dominant-baseline="central">Signs, sends consent</text>
<rect x="255" y="150" width="170" height="56" rx="8" class="pf" stroke-width="0.8"/><text class="h ph" x="340" y="168" text-anchor="middle" dominant-baseline="central">Composite</text><text class="s ps" x="340" y="188" text-anchor="middle" dominant-baseline="central">Checks, fans out</text>
<rect x="470" y="150" width="170" height="56" rx="8" class="tf" stroke-width="0.8"/><text class="h th" x="555" y="168" text-anchor="middle" dominant-baseline="central">Department registry</text><text class="s ts" x="555" y="188" text-anchor="middle" dominant-baseline="central">Verifies, filters</text>
<rect x="470" y="260" width="170" height="56" rx="8" class="tf" stroke-width="0.8"/><text class="h th" x="555" y="278" text-anchor="middle" dominant-baseline="central">Department PM, CM</text><text class="s ts" x="555" y="298" text-anchor="middle" dominant-baseline="central">Trust composite key</text>
<line x1="210" y1="178" x2="253" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="425" y1="178" x2="468" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="150" x2="340" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="555" y1="206" x2="555" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M425 68 L555 68 L555 148" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
