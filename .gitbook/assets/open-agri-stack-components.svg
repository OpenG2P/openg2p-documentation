<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="800" viewBox="0 0 1310 800" role="img" aria-label="Agri Stack components and who talks to whom, in layers. At the top the partner (bank, MFI, agritech). Below it the Exchange, its own install behind its own ingress: the partner portal, the Composite, national-ID login (eSignet), the Consent Manager, Partner Management, a catalogue and an Audit Manager. Below the Exchange the departments: Department A runs the Farmer Registry install and Department B the Crop Sown Registry install, each behind its own ingress with its own Consent Manager, Partner Management, catalogue and Audit Manager; other departments follow the same pattern. Path A: a partner uses one registry directly; the registry's Consent Manager finds the consent. Path B: the partner's staff raise a consent request in the partner portal (B1), the farmer logs in with the national ID (B2), the partner's system sends a signed query to the Composite (B3), which gets a consent token per registry from the Exchange Consent Manager (B4) and searches each registry with it (B5); each registry checks its token at its own Consent Manager, offline (B6). Path C: one registry is a partner of another."><style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:13px;font-weight:600} .s{font-size:11px;fill:#56625B} .lbl{font-size:11px;fill:#3B4640}
.cap{font-size:10.5px;letter-spacing:.07em;fill:#3B4640;font-family:'JetBrains Mono',Menlo,monospace;font-weight:600}
.n{font-size:11px;font-weight:700;fill:#1B231F}
.l1{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5} .l2{fill:#F7ECD4;stroke:#AE8433;stroke-width:1.5}
.dpi{fill:#E1EEF0;stroke:#3C7C88;stroke-width:1.5} .uc{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.plain{fill:#FFFFFF;stroke:#3B4640;stroke-width:1.3}
.infra{fill:#F3F4F3;stroke:#8A948E;stroke-width:1.2;stroke-dasharray:6 4}
.blk{fill:#FBFCFB;stroke:#7E8A82;stroke-width:1.6}
.faint{fill:#FAFBFA;stroke:#C8D0C8;stroke-width:1.2;stroke-dasharray:5 4}
.ar{stroke:#3B4640;stroke-width:1.4;fill:none}
.arA{stroke:#2F6FA8;stroke-width:1.6;fill:none} .arC{stroke:#9A5B12;stroke-width:1.6;fill:none}
.nA{font-size:11px;font-weight:700;fill:#2F6FA8} .nC{font-size:11px;font-weight:700;fill:#9A5B12}
</style><rect width="100%" height="100%" fill="#FFFFFF"/>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4640"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FA8"/></marker>
<marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A5B12"/></marker>
</defs>

<!-- Partner -->
<rect class="plain" x="230" y="16" width="1060" height="56" rx="6"/>
<text class="t" x="760" y="38" text-anchor="middle">Partner · bank · MFI · agritech</text>
<text class="s" x="262" y="62" text-anchor="middle">system</text>
<text class="s" x="366" y="62" text-anchor="middle">staff</text>
<text class="s" x="770" y="62" text-anchor="middle">system</text>

<!-- Farmer and national ID system -->
<rect class="plain" x="20" y="150" width="180" height="50" rx="6"/>
<text class="t" x="110" y="171" text-anchor="middle">Farmer</text><text class="s" x="110" y="188" text-anchor="middle">gives consent</text>
<rect class="plain" x="20" y="272" width="180" height="50" rx="6"/>
<text class="t" x="110" y="293" text-anchor="middle">National ID system</text><text class="s" x="110" y="310" text-anchor="middle">OTP · biometrics</text>

<!-- ═══ Exchange ═══ -->
<rect class="blk" x="250" y="100" width="1040" height="222" rx="10"/>
<text class="cap" x="264" y="116">EXCHANGE · OWN INSTALL</text>
<rect class="infra" x="266" y="124" width="1008" height="26" rx="5"/>
<text class="s" x="770" y="141" text-anchor="middle">Ingress (Nginx · Istio): TLS · routing</text>
<rect class="dpi" x="266" y="166" width="200" height="56" rx="6"/>
<text class="t" x="366" y="188" text-anchor="middle">Partner portal (CM)</text><text class="s" x="366" y="205" text-anchor="middle">consent requests · evidence</text>
<rect class="uc" x="640" y="166" width="260" height="56" rx="6"/>
<text class="t" x="770" y="188" text-anchor="middle">Composite</text><text class="s" x="770" y="205" text-anchor="middle">use cases · keeps no farmer data</text>
<rect class="dpi" x="266" y="250" width="200" height="56" rx="6"/>
<text class="t" x="366" y="272" text-anchor="middle">eSignet</text><text class="s" x="366" y="289" text-anchor="middle">national-ID login</text>
<rect class="dpi" x="486" y="250" width="260" height="56" rx="6"/>
<text class="t" x="616" y="272" text-anchor="middle">Consent Manager</text><text class="s" x="616" y="289" text-anchor="middle">consents · /validate → consent tokens</text>
<rect class="dpi" x="766" y="250" width="160" height="56" rx="6"/>
<text class="t" x="846" y="272" text-anchor="middle">Partner Management</text><text class="s" x="846" y="289" text-anchor="middle">keys · policies</text>
<rect class="l2" x="946" y="250" width="150" height="56" rx="6"/>
<text class="t" x="1021" y="272" text-anchor="middle">Catalogue</text><text class="s" x="1021" y="289" text-anchor="middle">datasets · geography</text>
<rect class="dpi" x="1110" y="250" width="164" height="56" rx="6"/>
<text class="t" x="1192" y="272" text-anchor="middle">Audit Manager</text><text class="s" x="1192" y="289" text-anchor="middle">the Exchange's events</text>
<!-- inside the Exchange -->
<polyline class="ar" points="468,194 520,194 520,248" marker-end="url(#a1)"/>
<line class="ar" x1="468" y1="278" x2="484" y2="278" marker-end="url(#a1)"/>
<line class="ar" x1="690" y1="224" x2="690" y2="248" marker-end="url(#a1)" marker-start="url(#a1)"/>
<text class="lbl" x="680" y="240" text-anchor="end">consent ↓ · tokens ↑</text><text class="n" x="680" y="226" text-anchor="end">B4</text>

<!-- ═══ Department A ═══ -->
<rect class="blk" x="250" y="370" width="510" height="286" rx="10"/>
<text class="cap" x="264" y="386">DEPARTMENT A · FARMER REGISTRY</text>
<rect class="infra" x="266" y="394" width="478" height="26" rx="5"/>
<text class="s" x="505" y="411" text-anchor="middle">Ingress (Nginx · Istio)</text>
<rect class="l1" x="266" y="436" width="478" height="56" rx="6"/>
<text class="t" x="505" y="458" text-anchor="middle">Farmer Registry</text><text class="s" x="505" y="475" text-anchor="middle">register · Farmer ID ↔ national ID</text>
<rect class="dpi" x="266" y="520" width="230" height="56" rx="6"/>
<text class="t" x="381" y="542" text-anchor="middle">Consent Manager</text><text class="s" x="381" y="559" text-anchor="middle">consents · trusts the Exchange's tokens</text>
<rect class="dpi" x="514" y="520" width="230" height="56" rx="6"/>
<text class="t" x="629" y="542" text-anchor="middle">Partner Management</text><text class="s" x="629" y="559" text-anchor="middle">partners · keys · policies</text>
<rect class="l2" x="266" y="596" width="230" height="44" rx="6"/>
<text class="t" x="381" y="614" text-anchor="middle">Catalogue</text><text class="s" x="381" y="630" text-anchor="middle">datasets · geography</text>
<rect class="dpi" x="514" y="596" width="230" height="44" rx="6"/>
<text class="t" x="629" y="614" text-anchor="middle">Audit Manager</text><text class="s" x="629" y="630" text-anchor="middle">the department's events</text>
<line class="ar" x1="381" y1="494" x2="381" y2="518" marker-end="url(#a1)"/>
<text class="n" x="389" y="510">A·B6·C</text><text class="lbl" x="431" y="510">check</text>
<line class="ar" x1="629" y1="494" x2="629" y2="518" marker-end="url(#a1)"/>
<text class="lbl" x="637" y="510">keys, policies</text>

<!-- ═══ Department B ═══ -->
<rect class="blk" x="780" y="370" width="510" height="286" rx="10"/>
<text class="cap" x="794" y="386">DEPARTMENT B · CROP SOWN REGISTRY</text>
<rect class="infra" x="796" y="394" width="478" height="26" rx="5"/>
<text class="s" x="1035" y="411" text-anchor="middle">Ingress (Nginx · Istio)</text>
<rect class="l1" x="796" y="436" width="478" height="56" rx="6"/>
<text class="t" x="1035" y="458" text-anchor="middle">Crop Sown Registry</text><text class="s" x="1035" y="475" text-anchor="middle">activity register: crops, plot by plot, season by season</text>
<rect class="dpi" x="796" y="520" width="230" height="56" rx="6"/>
<text class="t" x="911" y="542" text-anchor="middle">Consent Manager</text><text class="s" x="911" y="559" text-anchor="middle">consents · trusts the Exchange's tokens</text>
<rect class="dpi" x="1044" y="520" width="230" height="56" rx="6"/>
<text class="t" x="1159" y="542" text-anchor="middle">Partner Management</text><text class="s" x="1159" y="559" text-anchor="middle">partners · the Composite's ceiling</text>
<rect class="l2" x="796" y="596" width="230" height="44" rx="6"/>
<text class="t" x="911" y="614" text-anchor="middle">Catalogue</text><text class="s" x="911" y="630" text-anchor="middle">datasets · geography</text>
<rect class="dpi" x="1044" y="596" width="230" height="44" rx="6"/>
<text class="t" x="1159" y="614" text-anchor="middle">Audit Manager</text><text class="s" x="1159" y="630" text-anchor="middle">the department's events</text>
<line class="ar" x1="911" y1="494" x2="911" y2="518" marker-end="url(#a1)"/>
<text class="n" x="919" y="510">B6</text><text class="lbl" x="939" y="510">check</text>
<line class="ar" x1="1159" y1="494" x2="1159" y2="518" marker-end="url(#a1)"/>
<text class="lbl" x="1167" y="510">keys, policies</text>

<!-- Other departments -->
<rect class="faint" x="250" y="672" width="1040" height="40" rx="8"/>
<text class="lbl" x="770" y="696" text-anchor="middle">Other departments (Livestock, Land, …) follow the same pattern: their own install, usable directly or through the Composite</text>

<!-- ═══ Paths ═══ -->
<!-- B1 -->
<line class="ar" x1="366" y1="72" x2="366" y2="164" marker-end="url(#a1)"/>
<text class="n" x="374" y="92">B1</text><text class="lbl" x="394" y="92">consent request</text>
<!-- B2 -->
<polyline class="ar" points="200,175 214,175 214,266 264,266" marker-end="url(#a1)"/>
<text class="n" x="30" y="226">B2</text><text class="lbl" x="50" y="226">national-ID login</text>
<line class="ar" x1="264" y1="296" x2="202" y2="296" marker-end="url(#a1)"/>
<text class="lbl" x="110" y="342" text-anchor="middle">eSignet verifies the ID</text>
<!-- B3 -->
<line class="ar" x1="770" y1="72" x2="770" y2="164" marker-end="url(#a1)"/>
<text class="n" x="778" y="92">B3</text><text class="lbl" x="798" y="92">signed query (consent looked up)</text>
<!-- B5: Composite → each registry -->
<polyline class="ar" points="756,224 756,346 505,346 505,434" marker-end="url(#a1)"/>
<polyline class="ar" points="756,346 1035,346 1035,434" marker-end="url(#a1)"/>
<text class="n" x="770" y="340">B5</text><text class="lbl" x="790" y="340">search + its consent token, per registry</text>
<!-- A: partner directly to the Farmer Registry -->
<polyline class="arA" points="236,72 236,356 300,356 300,434" marker-end="url(#aA)"/>
<text class="nA" x="306" y="372">A</text>
<!-- C: Crop Sown Registry → Farmer Registry, as its partner -->
<line class="arC" x1="794" y1="464" x2="746" y2="464" marker-end="url(#aC)"/>
<text class="nC" x="766" y="456">C</text>

<!-- legend -->
<text class="nA" x="250" y="740">A</text><text class="lbl" x="264" y="740">a partner uses one registry directly; its CM finds the consent</text>
<text class="n" x="610" y="740">B1–B6</text><text class="lbl" x="652" y="740">distributed registries: one use case, through the Composite</text>
<text class="nC" x="1030" y="740">C</text><text class="lbl" x="1044" y="740">registry to registry, as its partner</text>
<text class="s" x="250" y="766">Each install has its own Partner Management, Consent Manager, catalogue and Audit Manager. The Exchange is its own install;</text>
<text class="s" x="250" y="782">it can share a cluster with a department or run in its own.</text>
</svg>
