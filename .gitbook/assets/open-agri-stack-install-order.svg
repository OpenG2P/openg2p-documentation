<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Install order: 1, the registries, each in its own namespace with its commons (Farmer Registry in trial, Crop Sown Registry in dept1); 2, the Exchange in agrix: Commons Base and Commons Services, then the Composite, which needs the registries' search URLs; 3, after install: partner portal users and the Exchange setup script; 4, test with exchange_test.sh.">
<style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:14px;font-weight:600} .s{font-size:11.5px;fill:#56625B} .lbl{font-size:11.5px;fill:#3B4640}
.cap{font-size:11px;letter-spacing:.08em;fill:#3B4640;font-family:'JetBrains Mono',Menlo,monospace;font-weight:700}
.mono{font-family:'JetBrains Mono',Menlo,monospace;font-size:11.5px;fill:#3B4640}
.plain{fill:#FFFFFF;stroke:#3B4640;stroke-width:1.3}
.clu{fill:#FBFCFB;stroke:#7E8A82;stroke-width:1.6}
.ns{fill:#FFFFFF;stroke:#B4BDB6;stroke-width:1.2;stroke-dasharray:5 4}
.ing{fill:#F1F2F1;stroke:#9AA39C;stroke-width:1.2;stroke-dasharray:4 3}
.dpi{fill:#E1EEF0;stroke:#3C7C88;stroke-width:1.5}
.cmp{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.reg{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5}
.ar{stroke:#3B4640;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4640"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect class="reg" x="20" y="30" width="220" height="130" rx="10"/>
<text class="cap" x="36" y="54">1 · REGISTRIES</text>
<text class="t" x="36" y="80">Farmer Registry</text><text class="s" x="36" y="97">in trial, with its commons</text>
<text class="t" x="36" y="124">Crop Sown Registry</text><text class="s" x="36" y="141">in dept1, with its commons</text>

<rect class="cmp" x="276" y="30" width="230" height="130" rx="10"/>
<text class="cap" x="292" y="54">2 · EXCHANGE (agrix)</text>
<text class="t" x="292" y="80">Commons Base, Services</text><text class="s" x="292" y="97">PM, CM, partner portal, eSignet, …</text>
<text class="t" x="292" y="124">Composite</text><text class="s" x="292" y="141">needs the registries' search URLs</text>

<rect class="dpi" x="542" y="30" width="220" height="130" rx="10"/>
<text class="cap" x="558" y="54">3 · AFTER INSTALL</text>
<text class="t" x="558" y="80">Partner portal users</text><text class="s" x="558" y="97">setup-partner-realm.sh</text>
<text class="t" x="558" y="124">Exchange setup</text><text class="s" x="558" y="141">the Composite's key and access</text>

<rect class="plain" x="798" y="30" width="182" height="130" rx="10"/>
<text class="cap" x="814" y="54">4 · TEST</text>
<text class="t" x="814" y="80">Partner test</text><text class="s" x="814" y="97">exchange_test.sh</text>
<text class="t" x="814" y="124">Consent in the portal</text><text class="s" x="814" y="141">optional</text>

<line class="ar" x1="242" y1="95" x2="274" y2="95" marker-end="url(#a)"/>
<line class="ar" x1="508" y1="95" x2="540" y2="95" marker-end="url(#a)"/>
<line class="ar" x1="764" y1="95" x2="796" y2="95" marker-end="url(#a)"/>
<text class="s" x="500" y="188" text-anchor="middle">Each step only once the previous one is ready: releases deployed, all pods running.</text>
</svg>
