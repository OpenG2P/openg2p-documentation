<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="760" viewBox="0 0 1150 760" role="img" aria-label="Sequence, path B in Exchange mode: the bank's signed query with its consent passes the Agriculture Department's ingress to the Composite, which checks the bank's signature against the Exchange Partner Management and asks the Exchange Consent Manager for one signed consent token per registry; the Composite searches the Farmer Registry with its consent token, which the Farmer Registry checks at its own Consent Manager (token status at the Exchange, intersected with its policy for the Composite); then the Crop Sown Registry in the Crops Department, the same way; the Composite returns a signed response with a status per source."><style>
text{font-family:'Public Sans','Helvetica Neue',Arial,sans-serif;fill:#1B231F}
.t{font-size:13px;font-weight:600} .s{font-size:11px;fill:#56625B} .lbl{font-size:11.5px;fill:#56625B}
.cap{font-size:10px;letter-spacing:.08em;fill:#56625B;font-family:'JetBrains Mono',Menlo,monospace}
.l1{fill:#E5EDF6;stroke:#56799F;stroke-width:1.5} .l2{fill:#F7ECD4;stroke:#AE8433;stroke-width:1.5}
.dpi{fill:#E1EEF0;stroke:#3C7C88;stroke-width:1.5} .uc{fill:#E3F0DF;stroke:#4B8646;stroke-width:1.5}
.plain{fill:#FFFFFF;stroke:#3B4640;stroke-width:1.3}
.infra{fill:#F3F4F3;stroke:#8A948E;stroke-width:1.3;stroke-dasharray:6 4}
.dept{fill:none;stroke:#C8D0C8;stroke-width:1.3;stroke-dasharray:5 4}
.band{fill:none;stroke:#56625B;stroke-width:1.2;stroke-dasharray:6 5}
.ar{stroke:#3B4640;stroke-width:1.4;fill:none} .ar.d{stroke-dasharray:5 4}
.life{stroke:#C8D0C8;stroke-width:1.2;stroke-dasharray:4 4}
</style><rect width="100%" height="100%" fill="#FFFFFF"/>
      <defs>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4640"/></marker>
      </defs>

      <!-- departments and installs -->
      <rect class="dept" x="132" y="6" width="752" height="88" rx="10"/>
      <text class="cap" x="142" y="20">AGRICULTURE DEPARTMENT</text>
      <rect class="dept" x="256" y="27" width="376" height="62" rx="8"/>
      <text class="cap" x="264" y="40">EXCHANGE</text>
      <rect class="dept" x="636" y="27" width="242" height="62" rx="8"/>
      <text class="cap" x="644" y="40">FARMER REGISTRY</text>
      <rect class="dept" x="890" y="6" width="252" height="88" rx="10"/>
      <text class="cap" x="900" y="20">CROPS DEPARTMENT</text>
      <rect class="dept" x="896" y="27" width="240" height="62" rx="8"/>
      <text class="cap" x="904" y="40">CROP SOWN REGISTRY</text>

      <!-- heads -->
      <rect class="plain" x="16" y="48" width="108" height="34" rx="6"/><text class="t" x="70" y="70" text-anchor="middle">Bank</text>
      <rect class="infra" x="141" y="48" width="108" height="34" rx="6"/><text class="t" x="195" y="70" text-anchor="middle">Ingress</text>
      <rect class="uc" x="266" y="48" width="108" height="34" rx="6"/><text class="t" x="320" y="70" text-anchor="middle">Composite</text>
      <rect class="dpi" x="391" y="48" width="108" height="34" rx="6"/><text class="t" x="445" y="70" text-anchor="middle">PM</text>
      <rect class="dpi" x="516" y="48" width="108" height="34" rx="6"/><text class="t" x="570" y="70" text-anchor="middle">CM</text>
      <rect class="l1" x="641" y="48" width="108" height="34" rx="6"/><text class="t" x="695" y="70" text-anchor="middle">Farmer Reg.</text>
      <rect class="dpi" x="766" y="48" width="108" height="34" rx="6"/><text class="t" x="820" y="70" text-anchor="middle">CM</text>
      <rect class="l1" x="901" y="48" width="108" height="34" rx="6"/><text class="t" x="955" y="70" text-anchor="middle">Crop Sown</text>
      <rect class="dpi" x="1024" y="48" width="108" height="34" rx="6"/><text class="t" x="1078" y="70" text-anchor="middle">CM</text>

      <!-- lifelines -->
      <line class="life" x1="70" y1="82" x2="70" y2="745"/>
      <line class="life" x1="195" y1="82" x2="195" y2="745"/>
      <line class="life" x1="320" y1="82" x2="320" y2="745"/>
      <line class="life" x1="445" y1="82" x2="445" y2="745"/>
      <line class="life" x1="570" y1="82" x2="570" y2="745"/>
      <line class="life" x1="695" y1="82" x2="695" y2="745"/>
      <line class="life" x1="820" y1="82" x2="820" y2="745"/>
      <line class="life" x1="955" y1="82" x2="955" y2="745"/>
      <line class="life" x1="1078" y1="82" x2="1078" y2="745"/>

      <!-- 1 query -->
      <line class="ar" x1="70" y1="128" x2="193" y2="128" marker-end="url(#a2)"/>
      <text class="lbl" x="132" y="121" text-anchor="middle">1 · query + consent</text>
      <line class="ar" x1="195" y1="158" x2="318" y2="158" marker-end="url(#a2)"/>
      <text class="lbl" x="257" y="151" text-anchor="middle">route</text>

      <!-- 2 partner check -->
      <line class="ar" x1="320" y1="196" x2="443" y2="196" marker-end="url(#a2)"/>
      <text class="lbl" x="382" y="189" text-anchor="middle">2 · bank's key</text>
      <line class="ar d" x1="445" y1="224" x2="322" y2="224" marker-end="url(#a2)"/>
      <text class="lbl" x="382" y="217" text-anchor="middle">key (cached)</text>
      <text class="s" x="312" y="248" text-anchor="end">signature,</text>
      <text class="s" x="312" y="262" text-anchor="end">allowed partners</text>

      <!-- 3 consent tokens -->
      <line class="ar" x1="320" y1="296" x2="568" y2="296" marker-end="url(#a2)"/>
      <text class="lbl" x="445" y="289" text-anchor="middle">3 · /validate, issue consent tokens</text>
      <line class="ar d" x1="570" y1="330" x2="322" y2="330" marker-end="url(#a2)"/>
      <text class="lbl" x="445" y="323" text-anchor="middle">one consent token per registry</text>
      <text class="s" x="445" y="348" text-anchor="middle">use case ∩ bank's policy ∩ consent</text>

      <!-- 4-6 Farmer Registry -->
      <line class="ar" x1="320" y1="388" x2="693" y2="388" marker-end="url(#a2)"/>
      <text class="lbl" x="507" y="381" text-anchor="middle">4 · DCI search + its consent token</text>
      <line class="ar" x1="695" y1="420" x2="818" y2="420" marker-end="url(#a2)"/>
      <text class="lbl" x="757" y="413" text-anchor="middle">5 · /validate</text>
      <line class="ar" x1="820" y1="448" x2="572" y2="448" marker-end="url(#a2)"/>
      <text class="lbl" x="696" y="441" text-anchor="middle">token revoked?</text>
      <line class="ar d" x1="570" y1="472" x2="818" y2="472" marker-end="url(#a2)"/>
      <text class="lbl" x="696" y="465" text-anchor="middle">status</text>
      <line class="ar d" x1="820" y1="500" x2="697" y2="500" marker-end="url(#a2)"/>
      <text class="lbl" x="757" y="493" text-anchor="middle">token ∩ policy</text>
      <line class="ar d" x1="695" y1="530" x2="322" y2="530" marker-end="url(#a2)"/>
      <text class="lbl" x="507" y="523" text-anchor="middle">6 · ok + released fields</text>

      <!-- 7 Crop Sown Registry -->
      <line class="ar" x1="320" y1="556" x2="953" y2="556" marker-end="url(#a2)"/>
      <text class="lbl" x="637" y="549" text-anchor="middle">7 · two DCI searches (season summaries, crop seasons) + its consent token</text>
      <line class="ar" x1="955" y1="588" x2="1076" y2="588" marker-end="url(#a2)"/>
      <text class="lbl" x="1016" y="581" text-anchor="middle">/validate (as in 5)</text>
      <line class="ar d" x1="1078" y1="618" x2="957" y2="618" marker-end="url(#a2)"/>
      <text class="lbl" x="1016" y="611" text-anchor="middle">token ∩ policy</text>
      <line class="ar d" x1="955" y1="650" x2="322" y2="650" marker-end="url(#a2)"/>
      <text class="lbl" x="637" y="643" text-anchor="middle">ok / no_record / denied / unavailable / error</text>

      <!-- 8 response -->
      <line class="ar d" x1="320" y1="700" x2="72" y2="700" marker-end="url(#a2)"/>
      <text class="lbl" x="195" y="693" text-anchor="middle">8 · signed response</text>
      <text class="s" x="195" y="718" text-anchor="middle">status per source; failed → null</text>
    </svg>
